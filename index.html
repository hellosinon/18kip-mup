<!DOCTYPE html>

<head>

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #000;
            color: #fff;
            font-family: "Noto Sans JP", sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .container {
            width: 90%;
            max-width: 520px;
        }

        h1 {
            font-size: clamp(1.45rem, 5.4vw, 2.15rem);
            font-weight: 700;
            margin: 0 0 12px;
            letter-spacing: .08em;
            line-height: 1.45;
        }

        .lead {

            font-size: clamp(1.05rem, 3.8vw, 1.28rem);
            font-weight: 500;
            letter-spacing: .06em;
        }

        .en {
            margin: 0 0 42px;
            font-family: "Atkinson Hyperlegible Mono", monospace;
            font-size: .72rem;
            font-weight: 700;
            color: #888;
            letter-spacing: .42em;
        }

        .ask {
            margin: 0 0 22px;
            font-size: 1rem;
            font-weight: 500;
            letter-spacing: .08em;
        }

        .buttons {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        a {
            display: block;
            padding: 20px 18px;
            border: 1px solid #555;
            border-radius: 12px;
            background: rgba(255, 255, 255, .05);
            color: #fff;
            text-decoration: none;
            font-size: 1.05rem;
            font-weight: 500;
            letter-spacing: .04em;
            transition: .2s;

        a:hover {
            background: rgba(255, 255, 255, .15);
            border-color: #f2c14e;
            color: #f2c14e;
        }

    <link rel="stylesheet" href="sl-transition.css">
    <script>try{if(sessionStorage.getItem('sl-dir'))document.documentElement.classList.add('sl-wait')}catch(e){}</script>
