<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>そうだ！電車で旅に出よう！</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #000;
            color: #fff;
            font-family: "Noto Sans JP", sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .container {
            width: 90%;
            max-width: 500px;
        }

        h1 {
            font-size: clamp(1.6rem, 6vw, 2.4rem);
            margin-bottom: 10px;
            letter-spacing: .12em;
        }

        .subtitle {
            color: #aaa;
            font-size: 1rem;
            margin-bottom: 45px;
        }

        .subtitle strong {
            color: #fff;
            font-weight: 700;
        }

        .buttons {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        a {
            display: block;
            padding: 20px;
            border: 1px solid #555;
            border-radius: 12px;
            background: rgba(255, 255, 255, .05);
            color: #fff;
            text-decoration: none;
            transition: .2s;
        }

        a:hover {
            background: rgba(255, 255, 255, .15);
        }

        .small {
            display: block;
            margin-top: 5px;
            font-size: .75rem;
            color: #888;
        }
    </style>
</head>

<body>

    <main class="container">

        <h1>そうだ！電車で旅に出よう！</h1>

        <p class="subtitle">
            <strong>青春18きっぷ</strong>で、今日はどこまで行きたい？？
        </p>

        <div class="buttons">

            <a href="tokyo.html">
                東京編
                <span class="small">東京からの各地到着時刻マップ</span>
            </a>

            <a href="osaka.html">
                大阪編
                <span class="small">大阪からの各地到着時刻マップ</span>
            </a>

        </div>

    </main>

</body>

</html>
